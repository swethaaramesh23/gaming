<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Level Failed. The page you are looking for has been moved, deleted, or does not exist.">
  <title>404 Level Failed // STACKLY</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 2.5 Second Preloader -->
  <div id="preloader">
    <div class="loader-container">
      <div class="cyber-spinner">
        <div class="spinner-outer"></div>
        <div class="spinner-inner"></div>
        <div class="spinner-logo">
          <svg viewBox="0 0 512 512">
            <path d="M416 128H96c-53 0-96 43-96 96v80c0 53 43 96 96 96h320c53 0 96-43 96-96v-80c0-53-43-96-96-96zm-240 176h-32v32c0 8.8-7.2 16-16 16s-16-7.2-16-16v-32h-32c-8.8 0-16-7.2-16-16s7.2-16 16-16h32v-32c0-8.8 7.2-16 16-16s16 7.2 16 16v32h32c8.8 0 16 7.2 16 16s-7.2 16-16 16zm176-32c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32zm48 48c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32z"/>
          </svg>
        </div>
      </div>
      <div class="loader-text">Initializing Uplink...</div>
      <div class="loader-percentage">0%</div>
      <div class="loader-bar-bg">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <main class="error-page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
    <a href="index.html" class="logo" style="margin-bottom: 20px; font-size: 2rem; color: var(--accent); font-weight: bold; text-decoration: none;" id="error-logo-link">
      <span>STACKLY</span>
    </a>

    <div class="error-code" style="font-size: 6rem; font-weight: 900; color: var(--text-primary);">404</div>
    <h1 class="error-title" style="margin-bottom: 20px;">Page Not Found</h1>
    <p class="error-description" style="color: var(--text-secondary); margin-bottom: 40px;">
      The page you are looking for has been moved or does not exist.
    </p>

    <div class="error-buttons">
      <a href="index.html" class="btn-primary" id="btn-err-home">Go Home</a>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
